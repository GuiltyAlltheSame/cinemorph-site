<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Cinemorph Studio</title>
  <meta name="robots" content="noindex">
  <style>
    @font-face {
      font-family: "League Gothic";
      src: url("assets/fonts/league-gothic.regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "VHS";
      src: url("assets/fonts/VHS.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(rgba(0, 0, 0, .78), rgba(0, 0, 0, .86)),
        var(--not-found-bg, url("assets/img/wallpaper_gallery_noise.gif")) center / cover no-repeat,
        #050607;
      color: #e8eef2;
      font-family: "VHS", Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, .10) 0,
          rgba(255, 255, 255, .10) 1px,
          rgba(0, 0, 0, .10) 1px,
          rgba(0, 0, 0, .10) 3px,
          transparent 3px,
          transparent 6px
        );
      mix-blend-mode: soft-light;
      opacity: .34;
    }

    main {
      position: relative;
      display: grid;
      width: min(760px, calc(100vw - 40px));
      gap: clamp(18px, 3vw, 30px);
      text-align: center;
    }

    p,
    h1 {
      margin: 0;
    }

    .kicker,
    .copy,
    .actions {
      transform: scaleY(1);
      transform-origin: center;
    }

    .kicker {
      color: rgba(232, 238, 242, .62);
      font-family: "League Gothic", Impact, "Arial Narrow", sans-serif;
      font-size: clamp(20px, 2.2vw, 30px);
      letter-spacing: .06em;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 {
      font-family: "League Gothic", Impact, "Arial Narrow", sans-serif;
      font-size: clamp(86px, 22vw, 220px);
      font-weight: 400;
      letter-spacing: .02em;
      line-height: .82;
      text-shadow:
        0 0 14px rgba(255, 255, 255, .14),
        0 0 42px rgba(95, 255, 142, .12);
      text-transform: uppercase;
    }

    .copy {
      max-width: 52ch;
      margin-inline: auto;
      color: rgba(232, 238, 242, .78);
      font-size: clamp(16px, 2.1vw, 24px);
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(232, 238, 242, .32);
      border-radius: 4px;
      padding: 10px 18px;
      background: rgba(0, 0, 0, .42);
      color: #e8eef2;
      font-family: "League Gothic", Impact, "Arial Narrow", sans-serif;
      font-size: 22px;
      letter-spacing: .04em;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        border-color .18s ease,
        background .18s ease,
        color .18s ease;
    }

    a:hover,
    a:focus-visible {
      border-color: rgba(255, 211, 107, .78);
      background: rgba(0, 0, 0, .68);
      color: #ffd36b;
      outline: 0;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Cinemorph Studio</p>
    <h1>404</h1>
    <p class="copy">This frame is missing. The page may have moved, the link may be broken, or the tape may have been pulled from the shelf.</p>
    <div class="actions" aria-label="Navigation">
      <a href="index.html">Back Home</a>
      <a href="index.html?section=contact">Contact</a>
    </div>
  </main>
  <script>
    const backgrounds = [
      "wallpaper_about_noise.gif",
      "wallpaper_contact_noise.gif",
      "wallpaper_gallery_noise.gif",
      "wallpaper_portfolio_noise.gif",
      "wallpaper_services_noise.gif"
    ];
    const image = backgrounds[Math.floor(Math.random() * backgrounds.length)];

    document.body.style.setProperty("--not-found-bg", `url("assets/img/${image}")`);
  </script>
</body>
</html>
